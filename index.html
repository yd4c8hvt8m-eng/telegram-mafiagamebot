<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>MAFIA ROOM</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- START -->
    <section id="screen-start" class="screen active">

        <div class="logo">
            <div class="logo-title">MAFIA</div>
            <div class="logo-subtitle">ROOM</div>
        </div>

        <div class="description">
            Управление игрой и статистика партии
        </div>

        <div class="card">

            <label for="playerCount">
                Количество игроков
            </label>

            <select id="playerCount">
                <option value="6">6 игроков</option>
                <option value="7">7 игроков</option>
                <option value="8">8 игроков</option>
                <option value="9">9 игроков</option>
                <option value="10">10 игроков</option>
                <option value="11">11 игроков</option>
                <option value="12">12 игроков</option>
                <option value="13">13 игроков</option>
                <option value="14">14 игроков</option>
                <option value="15">15 игроков</option>
            </select>

        </div>

        <button id="btnCreatePlayers" class="btn primary">
            Далее
        </button>

    </section>


    <!-- NAMES -->
    <section id="screen-names" class="screen">

        <div class="topbar">
            <button class="back-btn" data-back>←</button>

            <div>
                <div class="topbar-title">Игроки</div>
                <div class="topbar-subtitle">
                    Введите имена участников
                </div>
            </div>
        </div>

        <div id="namesContainer"></div>

        <div id="namesError" class="error"></div>

        <button id="btnToRoles" class="btn primary">
            Далее
        </button>

    </section>


    <!-- ROLES -->
    <section id="screen-roles" class="screen">

        <div class="topbar">
            <button class="back-btn" data-back>←</button>

            <div>
                <div class="topbar-title">Роли</div>
                <div class="topbar-subtitle">
                    Состав партии
                </div>
            </div>
        </div>

        <div id="rolesContainer"></div>

        <button id="btnStartGame" class="btn primary">
            Начать игру
        </button>

    </section>


    <!-- GAME -->
    <section id="screen-game" class="screen">

        <div class="topbar">

            <div>
                <div class="topbar-title">MAFIA ROOM</div>
                <div class="topbar-subtitle">
                    Текущая игра
                </div>
            </div>

        </div>


        <!-- СТАТИСТИКА -->
        <div class="stats">

            <div class="stat">
                <div id="statTotal">0</div>
                <span>Всего</span>
            </div>

            <div class="stat">
                <div id="statAlive">0</div>
                <span>Живых</span>
            </div>

            <div class="stat">
                <div id="statDead">0</div>
                <span>Выбыло</span>
            </div>

        </div>


        <!-- УПРАВЛЕНИЕ -->
        <div class="section-title">
            Управление
        </div>

        <div class="management-buttons">

            <button id="btnAddInteraction" class="btn secondary">
                + Взаимодействие
            </button>

            <button id="btnResetVotes" class="btn secondary">
                Сбросить голоса
            </button>

        </div>


        <!-- ИГРОКИ -->
        <div class="section-title">
            Игроки
        </div>

        <div id="playersContainer"></div>


        <!-- ИСТОРИЯ -->
        <div class="section-title">
            История
        </div>

        <div id="historyContainer"></div>


        <!-- СТАТИСТИКА ВЗАИМОДЕЙСТВИЙ -->
        <div class="section-title">
            Статистика взаимодействий
        </div>

        <div id="interactionStats"></div>


        <button id="btnFinishGame" class="btn danger">
            Завершить игру
        </button>

    </section>


    <!-- WINNER -->
    <section id="screen-winner" class="screen">

        <div class="winner">

            <div class="winner-label">
                ИГРА ОКОНЧЕНА
            </div>

            <h1 id="winnerTitle"></h1>

            <p id="winnerSubtitle"></p>

        </div>

        <button id="btnResults" class="btn primary">
            Посмотреть результаты
        </button>

        <button id="btnNewGame" class="btn secondary">
            Новая игра
        </button>

    </section>


    <!-- RESULTS -->
    <section id="screen-results" class="screen">

        <div class="topbar">

            <div>
                <div class="topbar-title">
                    Результаты
                </div>

                <div class="topbar-subtitle">
                    Итоги партии
                </div>
            </div>

        </div>

        <div id="resultsContainer"></div>

        <div class="section-title">
            Статистика взаимодействий
        </div>

        <div id="resultsInteractionStats"></div>

        <button id="btnNewGameFromResults" class="btn primary">
            Новая игра
        </button>

    </section>


    <!-- INTERACTION MODAL -->
    <div id="interactionModal" class="modal">

        <div class="modal-card">

            <div class="modal-title">
                Новое взаимодействие
            </div>

            <label>
                Кто?
            </label>

            <select id="interactionActor"></select>


            <label>
                С кем?
            </label>

            <select id="interactionTarget"></select>


            <label>
                Что произошло?
            </label>

            <input
                type="text"
                id="interactionDescription"
                placeholder="Например: голосование"
            >


            <div class="modal-buttons">

                <button
                    id="btnCancelInteraction"
                    class="btn secondary"
                >
                    Отмена
                </button>

                <button
                    id="btnSaveInteraction"
                    class="btn primary"
                >
                    Сохранить
                </button>

            </div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
